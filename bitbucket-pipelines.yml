# Bitbucket Pipelines - lib60870-C build matrix
#
# Six parallel steps covering all build-system / mbedtls-version combinations:
#   1. cmake    + mbedtls 2.28.x  (ssl_srv.c patch applied)
#   2. cmake    + mbedtls 3.6.x
#   3. Makefile + mbedtls 2.28.x  (ssl_srv.c patch applied)
#   4. Makefile + mbedtls 3.6.x
#   5. cmake    (no TLS)
#   6. Makefile (no TLS)
#
# The latest patch release of each minor series is resolved at run time via the
# GitHub Releases API.  A hardcoded fallback is used when the API is unavailable
# (e.g. due to rate-limiting from shared CI IP addresses).
#
# cmake auto-detects the mbedtls source folder under lib60870-C/dependencies/.
# The Makefile also auto-detects the folder and sets WITH_MBEDTLS or
# WITH_MBEDTLS3 accordingly; no extra flags are required.

image: ubuntu:24.04

definitions:
  steps:
    - step: &iec62351-3-compatibility
        name: "IEC 62351-3 TLS compatibility"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends build-essential ca-certificates cmake git libssl-dev openssh-client openssl patch python3
          - bash .ci/run-iec62351-3-tests.sh LIB8705-379-reference-server iec62351-3-results
        artifacts:
          - iec62351-3-results/**

    - step: &cs103-compatibility
        name: "CS103 compatibility (v2.2_develop)"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends build-essential cmake git openssh-client socat lcov
          - bash .ci/run-cs103-compatibility.sh v2.2_develop coverage-report-cs103
        artifacts:
          - coverage-report-cs103/**

    - step: &sec-auth-compatibility
        name: "Sec-Auth compatibility (main)"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends bzip2 build-essential ca-certificates cmake curl git openssh-client python3 wget
          - bash .ci/run-sec-auth-compatibility.sh main sec-auth-results
        artifacts:
          - sec-auth-results/**

    - step: &asan-no-tls
        name: "ASan: cmake (no TLS)"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential
          - cmake -S lib60870-C -B build-asan -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          - cmake --build build-asan --parallel $(nproc)
          - bash lib60870-C/tests/run-asan-tests.sh build-asan/tests/tests asan-results/no-tls.log
        artifacts:
          - asan-results/no-tls.log

    - step: &asan-mbedtls-228
        name: "ASan: cmake + mbedtls 2.28 (latest patch)"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential curl python3 ca-certificates patch bzip2 wget
          - |
            VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
              | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-2[.]28[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
              2>/dev/null) || true
            [ -n "$VER" ] || VER=2.28.10
            echo "Using mbedtls ${VER}"
            wget -q \
              "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
              -O /tmp/mbedtls.tar.bz2
            tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
            patch "lib60870-C/dependencies/mbedtls-${VER}/library/ssl_srv.c" \
              lib60870-C/dependencies/mbedtls_2.28_ssl_srv.c.patch
          - cmake -S lib60870-C -B build-asan -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          - cmake --build build-asan --parallel $(nproc)
          - bash lib60870-C/tests/run-asan-tests.sh build-asan/tests/tests asan-results/mbedtls-228.log
        artifacts:
          - asan-results/mbedtls-228.log

    - step: &asan-mbedtls-36
        name: "ASan: cmake + mbedtls 3.6 (latest patch)"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential curl python3 ca-certificates bzip2 wget
          - |
            VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
              | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-3[.]6[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
              2>/dev/null) || true
            [ -n "$VER" ] || VER=3.6.2
            echo "Using mbedtls ${VER}"
            wget -q \
              "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
              -O /tmp/mbedtls.tar.bz2
            tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
          - cmake -S lib60870-C -B build-asan -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          - cmake --build build-asan --parallel $(nproc)
          - bash lib60870-C/tests/run-asan-tests.sh build-asan/tests/tests asan-results/mbedtls-36.log
        artifacts:
          - asan-results/mbedtls-36.log

pipelines:
  branches:
    v2.4_develop_ci_test_coverage:
      - parallel:

        # ------------------------------------------------------------------ #
        # 1. cmake + mbedtls 2.28 (latest patch, ssl_srv.c patch applied)
        # ------------------------------------------------------------------ #
        - step: &cmake-mbedtls-228
            name: "cmake + mbedtls 2.28 (latest patch)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends cmake build-essential curl python3 ca-certificates patch bzip2 wget lcov
              - |
                VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
                  | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-2[.]28[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
                  2>/dev/null) || true
                [ -n "$VER" ] || VER=2.28.10
                echo "Using mbedtls ${VER}"
                wget -q \
                  "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
                  -O /tmp/mbedtls.tar.bz2
                tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
                # Apply the session-resumption patch required by IEC 62351-3:2023.
                patch "lib60870-C/dependencies/mbedtls-${VER}/library/ssl_srv.c" \
                  lib60870-C/dependencies/mbedtls_2.28_ssl_srv.c.patch
              - CFLAGS="--coverage -fprofile-update=atomic" LDFLAGS="--coverage" cmake -S lib60870-C -B build -DBUILD_EXAMPLES=OFF
              - cmake --build build --parallel $(nproc)
              - bash lib60870-C/tests/run-tests.sh build/tests/tests
              - lcov --directory build --capture --output-file coverage.info --ignore-errors gcov
              - lcov --remove coverage.info '/usr/*' '*/dependencies/*' '*/tests/*' --output-file coverage-filtered.info --ignore-errors unused
              - genhtml coverage-filtered.info -o coverage-report-mbedtls-228
            artifacts:
              - coverage-report-mbedtls-228/**

        # ------------------------------------------------------------------ #
        # 2. cmake + mbedtls 3.6 (latest patch)
        # ------------------------------------------------------------------ #
        - step: &cmake-mbedtls-36
            name: "cmake + mbedtls 3.6 (latest patch)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends cmake build-essential curl python3 ca-certificates bzip2 wget lcov
              - |
                VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
                  | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-3[.]6[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
                  2>/dev/null) || true
                [ -n "$VER" ] || VER=3.6.2
                echo "Using mbedtls ${VER}"
                wget -q \
                  "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
                  -O /tmp/mbedtls.tar.bz2
                tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
              - CFLAGS="--coverage -fprofile-update=atomic" LDFLAGS="--coverage" cmake -S lib60870-C -B build -DBUILD_EXAMPLES=OFF
              - cmake --build build --parallel $(nproc)
              - bash lib60870-C/tests/run-tests.sh build/tests/tests
              - lcov --directory build --capture --output-file coverage.info --ignore-errors gcov
              - lcov --remove coverage.info '/usr/*' '*/dependencies/*' '*/tests/*' --output-file coverage-filtered.info --ignore-errors unused
              - genhtml coverage-filtered.info -o coverage-report-mbedtls-36
            artifacts:
              - coverage-report-mbedtls-36/**

        # ------------------------------------------------------------------ #
        # 3. Makefile + mbedtls 2.28 (latest patch, ssl_srv.c patch applied)
        # ------------------------------------------------------------------ #
        - step: &make-mbedtls-228
            name: "Makefile + mbedtls 2.28 (latest patch)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends build-essential curl python3 ca-certificates patch bzip2 wget
              - |
                VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
                  | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-2[.]28[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
                  2>/dev/null) || true
                [ -n "$VER" ] || VER=2.28.10
                echo "Using mbedtls ${VER}"
                wget -q \
                  "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
                  -O /tmp/mbedtls.tar.bz2
                tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
                # Apply the session-resumption patch required by IEC 62351-3:2023.
                patch "lib60870-C/dependencies/mbedtls-${VER}/library/ssl_srv.c" \
                  lib60870-C/dependencies/mbedtls_2.28_ssl_srv.c.patch
              # The Makefile auto-detects the mbedtls-2.28.x directory and sets
              # WITH_MBEDTLS=1; both the library and test binary are built.
              - (cd lib60870-C && make -j$(nproc) lib tests)
              - cp lib60870-C/tests/*.pem lib60870-C/tests/*.cer lib60870-C/build/
              - cp lib60870-C/tests/certs/*.pem lib60870-C/tests/certs/*.key lib60870-C/tests/certs/*.crl lib60870-C/build/
              - bash lib60870-C/tests/run-tests.sh lib60870-C/build/tests.exe

        # ------------------------------------------------------------------ #
        # 4. Makefile + mbedtls 3.6 (latest patch)
        # ------------------------------------------------------------------ #
        - step: &make-mbedtls-36
            name: "Makefile + mbedtls 3.6 (latest patch)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends build-essential curl python3 ca-certificates bzip2 wget
              - |
                VER=$(curl -sf "https://api.github.com/repos/Mbed-TLS/mbedtls/releases?per_page=100" \
                  | python3 -c "import sys,json,re;d=json.load(sys.stdin);p=re.compile(r'^mbedtls-3[.]6[.](\d+)$');v=sorted([(int(m.group(1)),r['tag_name'].replace('mbedtls-','')) for r in d if not r['prerelease'] for m in [p.match(r['tag_name'])] if m],reverse=True);print(v[0][1])" \
                  2>/dev/null) || true
                [ -n "$VER" ] || VER=3.6.2
                echo "Using mbedtls ${VER}"
                wget -q \
                  "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${VER}/mbedtls-${VER}.tar.bz2" \
                  -O /tmp/mbedtls.tar.bz2
                tar xfj /tmp/mbedtls.tar.bz2 -C lib60870-C/dependencies/
              # The Makefile auto-detects the mbedtls-3.6.x directory and sets
              # WITH_MBEDTLS3=1; both the library and test binary are built.
              - (cd lib60870-C && make -j$(nproc) lib tests)
              - cp lib60870-C/tests/*.pem lib60870-C/tests/*.cer lib60870-C/build/
              - cp lib60870-C/tests/certs/*.pem lib60870-C/tests/certs/*.key lib60870-C/tests/certs/*.crl lib60870-C/build/
              - bash lib60870-C/tests/run-tests.sh lib60870-C/build/tests.exe

        # ------------------------------------------------------------------ #
        # 5. cmake (no TLS)
        # ------------------------------------------------------------------ #
        - step: &cmake-no-tls
            name: "cmake (no TLS)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends cmake build-essential lcov
              # No mbedtls in dependencies/ — cmake auto-detects nothing and
              # builds without TLS support.
              - CFLAGS="--coverage -fprofile-update=atomic" LDFLAGS="--coverage" cmake -S lib60870-C -B build -DBUILD_EXAMPLES=OFF
              - cmake --build build --parallel $(nproc)
              - bash lib60870-C/tests/run-tests.sh build/tests/tests
              - lcov --directory build --capture --output-file coverage.info --ignore-errors gcov
              - lcov --remove coverage.info '/usr/*' '*/dependencies/*' '*/tests/*' --output-file coverage-filtered.info --ignore-errors unused
              - genhtml coverage-filtered.info -o coverage-report-no-tls
            artifacts:
              - coverage-report-no-tls/**

        # ------------------------------------------------------------------ #
        # 6. Makefile (no TLS)
        # ------------------------------------------------------------------ #
        - step: &make-no-tls
            name: "Makefile (no TLS)"
            script:
              - apt-get update -qq
              - apt-get install -y --no-install-recommends build-essential
              # No mbedtls in dependencies/ — the Makefile auto-detects nothing
              # and builds without TLS support.
              - (cd lib60870-C && make -j$(nproc) lib tests)
              - bash lib60870-C/tests/run-tests.sh lib60870-C/build/tests.exe

        - step: *cs103-compatibility

    v2.4_develop:
      - parallel:
        - step: *cmake-mbedtls-228
        - step: *cmake-mbedtls-36
        - step: *make-mbedtls-228
        - step: *make-mbedtls-36
        - step: *cmake-no-tls
        - step: *make-no-tls
        - step: *cs103-compatibility
        - step: *iec62351-3-compatibility
        - step: *sec-auth-compatibility

    v2.5_develop:
      - parallel:
        - step: *cmake-mbedtls-228
        - step: *cmake-mbedtls-36
        - step: *make-mbedtls-228
        - step: *make-mbedtls-36
        - step: *cmake-no-tls
        - step: *make-no-tls
        - step: *cs103-compatibility

    master:
      - step: *cs103-compatibility

  custom:
    iec62351-3-compatibility:
      - step: *iec62351-3-compatibility
    cs103-compatibility:
      - step: *cs103-compatibility
    sec-auth-compatibility:
      - step: *sec-auth-compatibility
    full-test-matrix:
      - parallel:
        - step: *cmake-mbedtls-228
        - step: *cmake-mbedtls-36
        - step: *make-mbedtls-228
        - step: *make-mbedtls-36
        - step: *cmake-no-tls
        - step: *make-no-tls
        - step: *cs103-compatibility
    asan-test-matrix:
      - parallel:
        - step: *asan-no-tls
        - step: *asan-mbedtls-228
        - step: *asan-mbedtls-36
